[workspace]
resolver = "2"
members = ["projects/crates/*"]

[workspace.package]
version = "0.0.3"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"

[workspace.dependencies]
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dejavu = { git = "https://github.com/doki-land/dejavu-engine.git", rev = "8aba1a0a61ac9d7f2112123a57faec649cf67427" }
uuid = { version = "1", features = ["v7", "rng-getrandom"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
vos-generator = { path = "projects/crates/vos-generator" }
vos-format = { path = "projects/crates/vos-format" }
wasm-bindgen = "0.2"
oak-vos = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "d1337eb4d289505c85d988cd8f80b96023f1e63a" }
# VOS schema model and semantics are owned by the Boost `schema` tree.
schema-input-vos = { git = "https://github.com/oovm/rust-boost.git", rev = "b3aa3726f72123a8a8b8d656ddfac895e1d3d5a9" }
schema-types = { git = "https://github.com/oovm/rust-boost.git", rev = "b3aa3726f72123a8a8b8d656ddfac895e1d3d5a9" }

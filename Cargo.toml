[workspace]
resolver = "2"
members = ["projects/crates/*"]

[workspace.package]
version = "0.0.3"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"

[workspace.dependencies]
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dejavu = { git = "https://github.com/doki-land/dejavu-engine.git", branch = "dev" }
uuid = { version = "1", features = ["v7", "rng-getrandom"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
vos-generator = { path = "projects/crates/vos-generator" }
vos-format = { path = "projects/crates/vos-format" }
vos-types = { path = "projects/crates/vos-types" }
vos = { path = "projects/crates/vos" }
wasm-bindgen = "0.2"
oak-vos = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "12308f1f63988b5102b19151ef411d7acd7e0273" }

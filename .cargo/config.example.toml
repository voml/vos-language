# Copy to `config.toml` (git ignored) and replace `<your-path>` with your local absolute path.
# CI resolves the pinned Boost revision only.

[patch."https://github.com/oovm/rust-boost.git"]
data-text-vos = { path = "<your-path>/rust-boost/projects/data/data.text.vos" }
schema-input-vos = { path = "<your-path>/rust-boost/projects/schema/schema.input.vos" }
schema-types = { path = "<your-path>/rust-boost/projects/schema/schema.types" }
